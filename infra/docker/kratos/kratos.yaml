version: v0.13.0

dsn: memory

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - https://localhost:3000
        - https://localhost:3001
        - https://localhost:3002
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: https://localhost:3000/
  allowed_return_urls:
    - https://localhost:3000
    - https://localhost:3001
    - https://localhost:3002

  methods:
    password:
      enabled: true
    totp:
      config:
        issuer: Pine
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: https://localhost:3000/error

    settings:
      ui_url: https://localhost:3000/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: https://localhost:3000/recovery
      use: code

    verification:
      enabled: true
      ui_url: https://localhost:3000/verification
      use: code
      after:
        default_browser_return_url: https://localhost:3000/

    logout:
      after:
        default_browser_return_url: https://localhost:3000/signin

    login:
      ui_url: https://localhost:3000/signin
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: https://localhost:3000/registration
      after:
        password:
          hooks:
            - hook: session

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: argon2
  argon2:
    parallelism: 4
    memory: 128MB
    iterations: 3
    salt_length: 16
    key_length: 32

identity:
  default_schema_id: user
  schemas:
    - id: user
      url: file:///etc/config/kratos/user.schema.json

courier:
  template_override_path: /etc/config/kratos/courier-templates
  smtp:
    connection_uri: smtp://unused:unused@127.0.0.1:1/?disable_starttls=true
    from_address: unused@localhost
    from_name: Pine

feature_flags:
  use_continue_with_transitions: true

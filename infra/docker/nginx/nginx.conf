events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/tls/api-gateway/api-gateway.crt;
        ssl_certificate_key /etc/nginx/tls/api-gateway/api-gateway.key;

        client_max_body_size 64M;

        proxy_ssl_verify off;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /api {
            return 301 /api/;
        }

        location /api/ {
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_pass https://host.docker.internal:4000/;
        }

        location = /data {
            return 301 /data/;
        }

        location /data/ {
            proxy_set_header X-Forwarded-Prefix /data;
            proxy_pass https://host.docker.internal:4001/;
        }
    }

    server {
        listen 443 ssl;
        server_name openbao.localhost;

        ssl_certificate /etc/nginx/tls/openbao/openbao.crt;
        ssl_certificate_key /etc/nginx/tls/openbao/openbao.key;

        client_max_body_size 64M;

        proxy_ssl_verify off;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location / {
            proxy_pass https://openbao:8200;
        }
    }
}

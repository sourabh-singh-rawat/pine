global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: pyroscope
    static_configs:
      - targets:
          - pyroscope:4040

  - job_name: nats
    static_configs:
      - targets:
          - nats-exporter:7777

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

services:
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../.local/tls:/etc/nginx/tls:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
  nats:
    image: nats:2.14.3
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    command:
      - -p
      - "4222"
      - -m
      - "8222"
      - -js
      - -sd
      - /data
    volumes:
      - ../data/docker/nats-jetstream:/data
    healthcheck:
      test: ["CMD", "/nats-server", "--version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  nats-streams-init:
    image: natsio/nats-box:0.18.1
    restart: "no"
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        url="$${NATS_URL}"
        i=1
        while [ "$${i}" -le 60 ]; do
          if nats -s "$${url}" server check connection >/dev/null 2>&1; then
            break
          fi
          i=$$((i + 1))
          sleep 1
        done
        if ! nats -s "$${url}" server check connection >/dev/null 2>&1; then
          echo "nats-streams-init: NATS not reachable at $${url}" >&2
          exit 1
        fi
        for stream in attachment authorization identity items platform; do
          if nats -s "$${url}" stream info "$${stream}" >/dev/null 2>&1; then
            echo "ok  $${stream} (exists)"
            continue
          fi
          nats -s "$${url}" stream add "$${stream}" --subjects "$${stream}.>" --storage file --defaults >/dev/null
          echo "add $${stream}"
        done

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=pine-opensearch
      - node.name=pine-opensearch
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - ../data/docker/opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf 'http://127.0.0.1:9200/_cluster/health' >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 768M

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/clamav-entrypoint.sh"]
    ports:
      - "3310:3310"
    volumes:
      - ../data/docker/clamav-data:/var/lib/clamav
      - ./clamav/entrypoint.sh:/clamav-entrypoint.sh:ro
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2048M
        reservations:
          cpus: "0.20"
          memory: 512M

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - POSTGRES_IDENTITY_PASSWORD=${POSTGRES_IDENTITY_PASSWORD}
      - POSTGRES_ISSUES_PASSWORD=${POSTGRES_ISSUES_PASSWORD}
      - POSTGRES_ATTACHMENT_PASSWORD=${POSTGRES_ATTACHMENT_PASSWORD}
      - POSTGRES_NOTIFICATION_PASSWORD=${POSTGRES_NOTIFICATION_PASSWORD}
      - POSTGRES_PLATFORM_PASSWORD=${POSTGRES_PLATFORM_PASSWORD}
      - POSTGRES_AUTHZ_PASSWORD=${POSTGRES_AUTHZ_PASSWORD}
      - POSTGRES_AUDIT_PASSWORD=${POSTGRES_AUDIT_PASSWORD}
      - POSTGRES_KRATOS_PASSWORD=${POSTGRES_KRATOS_PASSWORD}
      - POSTGRES_HYDRA_PASSWORD=${POSTGRES_HYDRA_PASSWORD}
      - POSTGRES_KETO_PASSWORD=${POSTGRES_KETO_PASSWORD}
    volumes:
      - ../data/docker/pg-single-db-data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - 5432:5432
    command:
      - postgres
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    environment:
      - DSN=postgresql://kratos:${POSTGRES_KRATOS_PASSWORD}@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./kratos:/etc/config/kratos:ro
    command: migrate -c /etc/config/kratos/kratos.yaml sql -e --yes
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  kratos:
    image: oryd/kratos:v26.2.0
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      - DSN=postgresql://kratos:${POSTGRES_KRATOS_PASSWORD}@postgres:5432/kratos?sslmode=disable
      - LOG_LEVEL=debug
      - SECRETS_COOKIE=${KRATOS_SECRETS_COOKIE}
      - SECRETS_CIPHER=${KRATOS_SECRETS_CIPHER}
      - COURIER_SMTP_CONNECTION_URI=${COURIER_SMTP_CONNECTION_URI}
      - COURIER_SMTP_FROM_ADDRESS=${BREVO_EMAIL}
      - COURIER_SMTP_FROM_NAME=${COURIER_SMTP_FROM_NAME:-Pine}
    command: serve -c /etc/config/kratos/kratos.yaml --dev --watch-courier
    ports:
      - "4433:4433"
      - "4434:4434"
    volumes:
      - ./kratos:/etc/config/kratos:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    environment:
      - DSN=postgresql://hydra:${POSTGRES_HYDRA_PASSWORD}@postgres:5432/hydra?sslmode=disable
    volumes:
      - ./hydra:/etc/config/hydra:ro
    command: migrate -c /etc/config/hydra/hydra.yaml sql up -e --yes
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  hydra:
    image: oryd/hydra:v26.2.0
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      - DSN=postgresql://hydra:${POSTGRES_HYDRA_PASSWORD}@postgres:5432/hydra?sslmode=disable
      - SECRETS_SYSTEM=${HYDRA_SECRETS_SYSTEM}
      - URLS_SELF_ISSUER=http://127.0.0.1:4444
      - LOG_LEVEL=debug
    command: serve -c /etc/config/hydra/hydra.yaml all --dev
    ports:
      - "4444:4444"
      - "4445:4445"
    volumes:
      - ./hydra:/etc/config/hydra:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  keto-migrate:
    image: oryd/keto:v26.2.0
    environment:
      - DSN=postgresql://keto:${POSTGRES_KETO_PASSWORD}@postgres:5432/keto?sslmode=disable
    volumes:
      - ./keto/keto.yaml:/etc/config/keto/keto.yaml:ro
      - ../../services/authorization-service/src/integrations/authorization/ory-keto/opl:/etc/config/keto/opl:ro
    command: migrate -c /etc/config/keto/keto.yaml up -y
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  keto:
    image: oryd/keto:v26.2.0
    restart: unless-stopped
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    environment:
      - DSN=postgresql://keto:${POSTGRES_KETO_PASSWORD}@postgres:5432/keto?sslmode=disable
      - LOG_LEVEL=debug
    command: serve -c /etc/config/keto/keto.yaml
    ports:
      - "4466:4466"
      - "4467:4467"
    volumes:
      - ./keto/keto.yaml:/etc/config/keto/keto.yaml:ro
      - ../../services/authorization-service/src/integrations/authorization/ory-keto/opl:/etc/config/keto/opl:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -master.port=9333
      - -volume.port=8080
      - -filer
      - -s3
      - -s3.port=8333
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - ../data/docker/seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  seaweedfs-init:
    image: curlimages/curl:8.12.1
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-attachments}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for bucket in "$${S3_BUCKET}" identity-profiles; do
          echo "ensuring S3 bucket '$${bucket}'"
          status="$$(curl -s -o /tmp/create-bucket.xml -w "%{http_code}" -X PUT "http://seaweedfs:8333/$${bucket}")"
          echo "CreateBucket HTTP $${status}"
          if [ "$${status}" != "200" ] && [ "$${status}" != "409" ]; then
            cat /tmp/create-bucket.xml
            exit 1
          fi
          head_status="$$(curl -s -o /dev/null -w "%{http_code}" -I "http://seaweedfs:8333/$${bucket}")"
          echo "HeadBucket HTTP $${head_status}"
          if [ "$${head_status}" != "200" ]; then
            exit 1
          fi
        done

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.1
    profiles: [observability]
    command:
      - -varz
      - -connz
      - -routez
      - -subz
      - -jsz=all
      - http://nats:8222
    depends_on:
      - nats
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [observability]
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/postgres?sslmode=disable
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

  loki:
    image: grafana/loki:3.5.0
    profiles: [observability]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ../data/docker/loki-data:/loki
    command: -config.file=/etc/loki/loki.yaml
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  tempo:
    image: grafana/tempo:3.0.2
    profiles: [observability]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - ../data/docker/tempo-data:/var/tempo
    command:
      - -config.file=/etc/tempo.yaml
      - -target=all
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  pyroscope:
    image: grafana/pyroscope:2.1.1
    profiles: [observability]
    volumes:
      - ../data/docker/pyroscope-data:/var/lib/pyroscope
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: [observability]
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ../data/docker/prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    profiles: [observability]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [observability]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

  alloy:
    image: grafana/alloy:v1.17.1
    profiles: [observability]
    ports:
      - "4317:4317"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../data/docker/alloy-data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
      - prometheus
      - pyroscope
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  grafana:
    image: grafana/grafana:13.1.0
    profiles: [observability]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    ports:
      - 3300:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

apiVersion: postgres-operator.crunchydata.com/v1
kind: PostgresCluster
metadata:
  name: identity
spec:
  postgresVersion: 16
  users:
    - name: identity
      databases:
        - identity
  instances:
    - name: instance1
      replicas: 1
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  backups:
    pgbackrest:
      repos:
        - name: repo1
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi

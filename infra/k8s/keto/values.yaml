fullnameOverride: keto

image:
  tag: v26.2.0

service:
  read:
    port: 4466
  write:
    port: 4467

keto:
  automigration:
    enabled: true
    type: job
  config:
    dsn: ""
    log:
      level: debug
      format: text
      leak_sensitive_values: true
    serve:
      read:
        host: 0.0.0.0
        port: 4466
      write:
        host: 0.0.0.0
        port: 4467
    namespaces:
      location: file:///etc/config/keto/opl/namespaces.ts

deployment:
  extraEnv:
    - name: DSN
      valueFrom:
        secretKeyRef:
          name: keto-dsn
          key: dsn
  extraVolumes:
    - name: opl
      configMap:
        name: keto-opl
  extraVolumeMounts:
    - name: opl
      mountPath: /etc/config/keto/opl
      readOnly: true
  automigration:
    extraEnv:
      - name: DSN
        valueFrom:
          secretKeyRef:
            name: keto-dsn
            key: dsn
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

job:
  extraEnv:
    - name: DSN
      valueFrom:
        secretKeyRef:
          name: keto-dsn
          key: dsn

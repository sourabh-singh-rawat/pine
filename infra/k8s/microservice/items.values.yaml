name: items

replicaCount: 1

image:
  repository: pine/items-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  enabled: true
  port: 5001
  targetPort: 5001

secretRefs:
  - items-secrets

tls:
  enabled: true
  secretName: items-tls
  mountPath: /certs

env:
  NODE_ENV: production
  NATS_URL: nats://nats.nats.svc:4222
  ITEMS_SERVICE_URL: https://items.pine.svc:5001
  AUTHORIZATION_SERVICE_URL: https://authorization.pine.svc:5006
  ATTACHMENT_SERVICE_URL: https://attachment.pine.svc:5003
  DATA_GATEWAY_PUBLIC_URL: https://data-gateway.pine.svc:4001
  ITEMS_SERVICE_TLS_KEY_PATH: /certs/tls.key
  ITEMS_SERVICE_TLS_CERT_PATH: /certs/tls.crt
  CA_CERT_PATH: /certs/ca.crt

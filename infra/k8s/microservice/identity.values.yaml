name: identity

replicaCount: 1

image:
  repository: pine/identity-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  enabled: true
  port: 5000
  targetPort: 5000

secretRefs:
  - identity-secrets

tls:
  enabled: true
  secretName: identity-tls
  mountPath: /certs

env:
  NODE_ENV: production
  NATS_URL: nats://nats.nats.svc:4222
  IDENTITY_SERVICE_URL: https://identity.pine.svc:5000
  AUTHORIZATION_SERVICE_URL: https://authorization.pine.svc:5006
  OAUTH_SERVICE_URL: https://oauth.pine.svc:5008
  API_PUBLIC_URL: https://localhost/api
  S3_ENDPOINT: http://seaweedfs.pine.svc:8333
  S3_REGION: us-east-1
  IDENTITY_S3_BUCKET: identity-profiles
  KRATOS_PUBLIC_URL: http://kratos-public.pine.svc:4433
  KRATOS_ADMIN_URL: http://kratos-admin.pine.svc:4434
  IDENTITY_SERVICE_TLS_KEY_PATH: /certs/tls.key
  IDENTITY_SERVICE_TLS_CERT_PATH: /certs/tls.crt
  CA_CERT_PATH: /certs/ca.crt

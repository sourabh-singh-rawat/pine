name: attachment

replicaCount: 1

image:
  repository: pine/attachment-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  enabled: true
  port: 5003
  targetPort: 5003

secretRefs:
  - attachment-secrets

tls:
  enabled: true
  secretName: attachment-tls
  mountPath: /certs

env:
  NODE_ENV: production
  NATS_URL: nats://nats.nats.svc:4222
  ATTACHMENT_SERVICE_URL: https://attachment.pine.svc:5003
  DATA_GATEWAY_URL: https://data-gateway.pine.svc:4001
  S3_ENDPOINT: http://seaweedfs.pine.svc:8333
  S3_REGION: us-east-1
  S3_BUCKET: attachments
  ATTACHMENT_SERVICE_TLS_KEY_PATH: /certs/tls.key
  ATTACHMENT_SERVICE_TLS_CERT_PATH: /certs/tls.crt
  CA_CERT_PATH: /certs/ca.crt

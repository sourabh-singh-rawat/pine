query GetListItems($listId: String!, $first: Int, $statusId: String, $after: String) {
  getListItems(listId: $listId, first: $first, statusId: $statusId, after: $after) {
    status {
      id
      name
      orderIndex
      color
      type
    }
    items {
      description
      id
      name
      statusId
      priority
      dueDate
      hasChildren
      checklistCounts {
        completedCount
        totalCount
      }
      tags {
        id
        name
        color
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

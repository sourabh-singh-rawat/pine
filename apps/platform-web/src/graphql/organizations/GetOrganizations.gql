query GetOrganizations($tenantId: String!, $parentOrganizationId: String) {
  getOrganizations(tenantId: $tenantId, parentOrganizationId: $parentOrganizationId) {
    id
    tenantId
    parentOrganizationId
    officeTypeId
    name
    slug
    description
    isActive
    createdAt
    updatedAt
  }
}

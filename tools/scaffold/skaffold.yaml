apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: issue-tracker-services
build:
  artifacts:
    - image: sourabhrawatcc/attachment
      context: ../..
      docker:
        dockerfile: Dockerfile
        target: attachment

    - image: sourabhrawatcc/notification-service
      context: ../..
      docker:
        dockerfile: Dockerfile
        target: notification-service

    - image: sourabhrawatcc/identity-service
      context: ../..
      docker:
        dockerfile: Dockerfile
        target: identity-service

    - image: sourabhrawatcc/items-service
      context: ../..
      docker:
        dockerfile: Dockerfile
        target: items-service

  local:
    concurrency: 0
deploy:
  helm:
    releases:
      - name: attachment
        chartPath: ../../infra/k8s/microservice
        valuesFiles:
          - ../../infra/k8s/microservice/attachment.values.yaml

      - name: notification
        chartPath: ../../infra/k8s/microservice
        valuesFiles:
          - ../../infra/k8s/microservice/notification.values.yaml

      - name: identity
        chartPath: ../../infra/k8s/microservice
        valuesFiles:
          - ../../infra/k8s/microservice/identity-service.values.yaml

      - name: items-service
        chartPath: ../../infra/k8s/microservice
        valuesFiles:
          - ../../infra/k8s/microservice/items-service.values.yaml

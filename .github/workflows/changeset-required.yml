name: changeset-required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changeset-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset-required:
    name: changeset-required
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check skip label
        id: skip
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if echo ",$LABELS," | grep -q ",skip-changeset,"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR has label 'skip-changeset' — changeset check skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"

      - name: Ensure PR base is available
        if: steps.skip.outputs.skip != 'true'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Run changeset-required
        if: steps.skip.outputs.skip != 'true'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          echo "Checking changesets since ${BASE} (at most one; release/* must have zero)…"
          if ! node --no-warnings --experimental-strip-types \
            tools/scripts/release/changeset-required.ts "$BASE"; then
            echo ""
            echo "::error::This PR may include at most one Changeset (zero is fine). release/* PRs must include none."
            exit 1
          fi
